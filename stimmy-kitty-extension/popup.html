<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stimmy Kitty</title>
    <style>
      :root {
        color: #2d1a4a;
        font-family: system-ui, sans-serif;
        background: #faf7ff;
      }

      body {
        margin: 0;
        width: 360px;
        min-height: 480px;
        background: #faf7ff;
        color: #2d1a4a;
      }

      .container {
        padding: 16px;
      }

      .pill-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .pill {
        flex: 1;
        border: none;
        border-radius: 999px;
        padding: 10px 12px;
        font-size: 0.95rem;
        cursor: pointer;
        background: rgba(201, 160, 220, 0.16);
        color: #2d1a4a;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .pill.active {
        background: #d8c1f6;
        box-shadow: inset 0 0 0 1px rgba(45, 26, 74, 0.12);
      }

      .kitty-block {
        position: relative;
        width: 100%;
        max-width: 320px;
        margin: 0 auto 10px;
      }

      .kitty-image {
        position: absolute;
        inset: 0;
        display: block;
        margin: 0 auto;
        width: 100%;
        max-width: 320px;
        height: 100%;
        object-fit: cover;
        border-radius: 28px;
        box-shadow: 0 12px 30px rgba(38, 17, 55, 0.16);
        user-select: none;
      }

      #particleCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      #bubbleResults {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .bubble {
        position: absolute;
        width: 150px;
        max-width: 48%;
        background: #fff;
        border: 2px solid rgba(121, 73, 156, 0.34);
        border-radius: 18px;
        padding: 9px 10px;
        box-shadow: 0 10px 24px rgba(38, 17, 55, 0.16);
        opacity: 0;
        transform: translateY(6px) scale(0.92);
      }

      .bubble .result-title {
        margin-bottom: 4px;
        font-size: 0.78rem;
        line-height: 1.15;
      }

      .bubble .result-pill {
        margin-bottom: 4px;
        padding: 3px 6px;
        font-size: 0.66rem;
      }

      .bubble .result-detail {
        display: -webkit-box;
        overflow: hidden;
        font-size: 0.72rem;
        line-height: 1.25;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .bubble::after {
        content: "";
        position: absolute;
        width: 14px;
        height: 14px;
        background: #fff;
        border-right: 2px solid rgba(121, 73, 156, 0.34);
        border-bottom: 2px solid rgba(121, 73, 156, 0.34);
        transform: rotate(45deg);
      }

      .bubble.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      .bubble.slot-0 {
        top: 8px;
        left: 10px;
      }

      .bubble.slot-0::after {
        left: 62px;
        bottom: -8px;
      }

      .bubble.slot-1 {
        top: 28px;
        right: 8px;
      }

      .bubble.slot-1::after {
        right: 54px;
        bottom: -8px;
      }

      .bubble.slot-2 {
        right: 16px;
        bottom: 24px;
      }

      .bubble.slot-2::after {
        left: 34px;
        top: -8px;
        transform: rotate(225deg);
      }

      .kitty-label {
        text-align: center;
        margin-top: 8px;
        font-size: 0.95rem;
        opacity: 0.9;
      }

      .panel {
        margin-top: 12px;
      }

      .search-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        border: 1px solid #e7d8f7;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.95rem;
        background: #fff;
        color: #2d1a4a;
      }

      button#searchButton {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        background: #c9a0dc;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button#searchButton:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #status {
        min-height: 20px;
        color: #7a4aaa;
        font-size: 0.88rem;
        margin-bottom: 8px;
      }

      #results {
        max-height: 170px;
        overflow-y: auto;
        display: grid;
        gap: 10px;
        padding-right: 4px;
      }

      .result-card {
        background: #fff;
        border: 1px solid rgba(121, 73, 156, 0.14);
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 0 8px 18px rgba(38, 17, 55, 0.06);
        opacity: 0;
        transform: translateY(6px);
      }

      .result-card.visible {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .result-card.selected {
        border-color: rgba(121, 73, 156, 0.42);
        box-shadow: 0 8px 18px rgba(38, 17, 55, 0.12);
      }

      .result-title {
        margin: 0 0 6px;
        font-size: 0.98rem;
        font-weight: 700;
      }

      .result-pill {
        display: inline-block;
        background: #f0e8ff;
        color: #7a4aaa;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.78rem;
        margin-bottom: 8px;
      }

      .result-detail {
        margin: 0;
        color: #5e4d7a;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="pill-row">
        <button id="stimModeButton" class="pill active">✦ stim</button>
        <button id="searchModeButton" class="pill">AI search</button>
      </div>

      <div class="kitty-block">
        <div style="position: relative; width: 100%; height: 0; padding-bottom: 100%;">
          <img class="kitty-image" src="kitten.png" alt="A cartoon kitten" draggable="false" />
          <div id="bubbleResults" class="hidden"></div>
          <canvas id="particleCanvas" width="320" height="320"></canvas>
        </div>
      </div>

      <div class="kitty-label" id="kittyLabel">tap the kitty</div>

      <div class="panel hidden" id="searchPanel">
        <div class="search-row">
          <input id="searchInput" type="text" placeholder="restaurants in SF, hikes near LA..." />
          <button id="searchButton">Search</button>
        </div>
        <div id="status"></div>
        <div id="results"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
