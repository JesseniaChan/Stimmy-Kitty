<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stimmy Kitty</title>
    <style>
      :root {
        color: #2d1a4a;
        font-family: system-ui, sans-serif;
        background: #faf7ff;
      }

      body {
        margin: 0;
        width: 360px;
        min-height: 480px;
        background: #faf7ff;
        color: #2d1a4a;
      }

      .container {
        padding: 16px;
      }

      .pill-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .pill {
        flex: 1;
        border: none;
        border-radius: 999px;
        padding: 10px 12px;
        font-size: 0.95rem;
        cursor: pointer;
        background: rgba(201, 160, 220, 0.16);
        color: #2d1a4a;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .pill.active {
        background: #d8c1f6;
        box-shadow: inset 0 0 0 1px rgba(45, 26, 74, 0.12);
      }

      .kitty-block {
        position: relative;
        width: 100%;
        max-width: 320px;
        margin: 0 auto 10px;
      }

      svg {
        display: block;
        margin: 0 auto;
        width: 100%;
        max-width: 320px;
      }

      #particleCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .kitty-label {
        text-align: center;
        margin-top: 8px;
        font-size: 0.95rem;
        opacity: 0.9;
      }

      .panel {
        margin-top: 12px;
      }

      .search-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        border: 1px solid #e7d8f7;
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 0.95rem;
        background: #fff;
        color: #2d1a4a;
      }

      button#searchButton {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        background: #c9a0dc;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button#searchButton:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #status {
        min-height: 20px;
        color: #7a4aaa;
        font-size: 0.88rem;
        margin-bottom: 8px;
      }

      #results {
        max-height: 260px;
        overflow-y: auto;
        display: grid;
        gap: 10px;
        padding-right: 4px;
      }

      .result-card {
        background: #fff;
        border: 1px solid rgba(121, 73, 156, 0.14);
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 0 8px 18px rgba(38, 17, 55, 0.06);
        opacity: 0;
        transform: translateY(6px);
      }

      .result-card.visible {
        opacity: 1;
        transform: translateY(0);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .result-title {
        margin: 0 0 6px;
        font-size: 0.98rem;
        font-weight: 700;
      }

      .result-pill {
        display: inline-block;
        background: #f0e8ff;
        color: #7a4aaa;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.78rem;
        margin-bottom: 8px;
      }

      .result-detail {
        margin: 0;
        color: #5e4d7a;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="pill-row">
        <button id="stimModeButton" class="pill active">✦ stim</button>
        <button id="searchModeButton" class="pill">AI search</button>
      </div>

      <div class="kitty-block">
        <div style="position: relative; width: 100%; height: 0; padding-bottom: 100%;">
          <svg viewBox="0 0 320 320" preserveAspectRatio="xMidYMid meet" style="position:absolute; inset:0; width:100%; height:100%;">
            <defs>
              <linearGradient id="bodyGlow" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f8f0ff" />
                <stop offset="100%" stop-color="#e8d5f5" />
              </linearGradient>
            </defs>
            <path d="M80 160c0-52 42-94 94-94s94 42 94 94c0 52-42 94-94 94S80 212 80 160Z" fill="url(#bodyGlow)" />
            <path d="M104 150c-16-10-32-6-38 6s-4 32 8 40 78 32 122 10 38-44 28-58-28-22-44-12" fill="#f8f0ff" />
            <path d="M192 66c0 0 22-52 54-22s4 62-18 78-78 26-78 26Z" fill="#e8d5f5" stroke="#c9a0dc" stroke-width="6" />
            <path d="M128 66c0 0-22-52-54-22s-4 62 18 78 78 26 78 26Z" fill="#e8d5f5" stroke="#c9a0dc" stroke-width="6" />
            <path d="M112 42 88 90 124 82Z" fill="#f8f0ff" />
            <path d="M208 42 232 90 196 82Z" fill="#f8f0ff" />
            <path d="M86 80c6-8 18-12 24-8s4 18-2 26-16 14-26 10-8-18 4-28Z" fill="#f5c6e8" />
            <path d="M234 80c-6-8-18-12-24-8s-4 18 2 26 16 14 26 10 8-18-4-28Z" fill="#f5c6e8" />
            <path d="M124 106c0 16 32 18 42 18s42-2 42-18" fill="#f8f0ff" stroke="#c9a0dc" stroke-width="6" stroke-linecap="round" />
            <circle cx="120" cy="150" r="16" fill="#2d1a4a" />
            <circle cx="198" cy="150" r="16" fill="#2d1a4a" />
            <circle cx="114" cy="144" r="5" fill="#fff" />
            <circle cx="192" cy="144" r="5" fill="#fff" />
            <circle cx="160" cy="170" r="12" fill="#f5a0c8" />
            <path d="M144 186c8 8 24 8 32 0" fill="none" stroke="#d080a0" stroke-width="5" stroke-linecap="round" />
            <path d="M100 156c24 0 36-6 60-12" fill="none" stroke="#c9a0dc" stroke-width="4" stroke-linecap="round" />
            <path d="M220 156c-24 0-36-6-60-12" fill="none" stroke="#c9a0dc" stroke-width="4" stroke-linecap="round" />
            <path d="M70 220c-18 22-8 46 16 56" fill="none" stroke="#c9a0dc" stroke-width="10" stroke-linecap="round" />
            <path d="M250 220c18 22 8 46-16 56" fill="none" stroke="#c9a0dc" stroke-width="10" stroke-linecap="round" />
            <path d="M140 250c-10 14-20 18-30 18s-20-8-24-22" fill="#f8f0ff" stroke="#c9a0dc" stroke-width="6" />
            <path d="M180 250c10 14 20 18 30 18s20-8 24-22" fill="#f8f0ff" stroke="#c9a0dc" stroke-width="6" />
            <ellipse cx="160" cy="230" rx="58" ry="24" fill="#f8f0ff" />
          </svg>
          <canvas id="particleCanvas" width="320" height="320"></canvas>
        </div>
      </div>

      <div class="kitty-label" id="kittyLabel">tap the kitty</div>

      <div class="panel hidden" id="searchPanel">
        <div class="search-row">
          <input id="searchInput" type="text" placeholder="restaurants in SF, hikes near LA..." />
          <button id="searchButton">Search</button>
        </div>
        <div id="status"></div>
        <div id="results"></div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
